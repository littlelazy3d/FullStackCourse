<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
<!--CSS-->
    <style>
        body{
            background: #40527c;
            font-family: Arial;
        }

         .register-card{
            width: 500px;
            background: white;
            border-radius: 15px;
         }

         .form-control{
            border-radius: 10px;
            height: 50px;
         }
         .form-control:focus{
            background:white;
            border:1px solid #4da3ff;
            box-shadow:0 0 10px rgba(77,163,255,.2);
         }

        .btn-primary:hover{
            transform:translateY(-2px);
            transition:.3s;
            }
    </style>

</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="register-card">
            <div class="p-5">
                <h1 class="fw-bold mb-2"> Please Sign in</h1>
                <p class="text-muted mb-4"> 
                    Fill in the information below to create your account.
                </p>

                <form id="form">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <input id="fname" type="text" class="form-control" placeholder="First Name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <input id="lname" type="text" class="form-control" placeholder="Last Name" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <input id="email" type="email" class="form-control" placeholder="Email" required>
                    </div>
                    <div class="mb-3">
                        <input id="password" type="password" class="form-control" placeholder="Password" required>
                    </div>

                    <div class="mb-3">
                        <input id="confirmPass" type="password" class="form-control" placeholder="Confirm Password" required>
                    </div>

                    <div>

                    </div>
                    <div>
                        <input type="checkbox" class="form-check-input" id="terms" required>
                        <label class="ms-2">I agree to the terms and conditions </label>
                    </div>
                    <button class="btn btn-primary w-100 py-2 mt-3"> Sign in </button>

                    <div class="text-center py-3">
                        Dont have an account? <a href="#"> Register </a>
                    </div>
                </form>
            </div>
        </div>
    </div>




    <script>
        const form = document.getElementById('form');
        const firstname = document.getElementById('fname');
        const email = document.getElementById('email');
        const lastname = document.getElementById('lname');
        const password = document.getElementById('password');
        const confirmPass = document.getElementById('confirmPass');

        form.addEventListener("submit", function(event) {
            let error = [];
            if(firstname.value === '' || firstname === null){
                error.push('field required')
            }

            if(password.value.length < 8){
                error.push('password must be atleast 8 characters')
            }
            if(password.value !== confirmPass.value){
                error.push('passwords do not match');
            }
        }
    );
    </script>
</body>
</html>
